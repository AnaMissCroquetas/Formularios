<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio</title>
</head>

<body>

    <form action="https://httpbin.org/get" method="get">
        <p>Datos personales</p>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre">

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos">
        <label for="fechanacimiento">Fecha Nacimiento</label>
        <input id="number" name="asunto"></input>

        <p>Datos de contacto</p>

        <label for="correoelectronico">Correo Electrónico</label>
        <input type="email" id="correoelectronico" name="correoelectronico">

        <label for="telefono">Teléfono</label>
        <input type="number" name="telefono"></input>
        
        <p>¿De qué ciudad eres?</p>
        
        <label for="ciudad" name="ciudad"></label>
        <select id="ciudad">
            <option value="default"></option>
            <option value="cordoba">Córdoba</option>
            <option value="granada">Graná</option>
            <option value="sevilla">Sevilla</option>
            <option value="almeria">Almería</option>
            <option value="jaen">Jaén</option>
            <option value="malaga">Málaga</option>
            <option value="cadiz">Cádiz</option>
            <option value="huelva">Huelva</option>
</select>

<p>Modalidad de formación</p>

<input type="radio" id="presencial" name="modalidad" value="presencial">
<label for="presencial">Presencial</label>

<input type="radio" id="mixta" name="modalidad" value="mixta">
<label for="mixta">Mixta</label>

<input type="radio" id="online" name="modalidad" value="online">
<label for="online">Online</label>

<p>¿Intereses?</p>
<input type="checkbox" id="programacion"
name="intereses" value="programacion">
<label for="programacion">Programación</label>

<input type="checkbox" id="html"
name="intereses" value="html">
<label for="html">Html</label>

<input type="checkbox" id="diseñoweb"
name="intereses" value="diseñoweb">
<label for="diseñoweb">Diseño Web</label>

<input type="checkbox" id="diseñografico"
name="intereses" value="diseñografico">
<label for="diseñografico">Diseño Gráfico</label>

<p>¿Quieres añadir algún comentario?</p>
<label for="Mensajelargo"></label>
<textarea id="asunto" name="asunto" rows="10"> </textarea>

<br>

<fieldset>
<legend>Más comentarios</legend>
<label for="comentarios">¿Te apetece saber algo más?</label>
<input type="text" id="comentarios" name="comentarios">
    </fieldset>
</fieldset>

<button type="Elegir">Enviar información</button>

    </form>

</body>

</html>
